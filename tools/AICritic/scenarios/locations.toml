quartermaster = [10, -142]      # Quartermaster Holt's supply tent (vendor)
north_gate = [0, -92]
east_gate = [48, -140]
west_gate = [-48, -140]
mere_southwest = [-55, -97]     # open shore south of two Mire Croakers (level 1)
mere_east = [58, -84]           # the east shore, a group of Mire Croakers
greywood = [-160, 130]          # Dusk Wolves (level 3-5)
