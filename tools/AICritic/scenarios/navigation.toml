name = "navigation"
description = "Walk out through Mirewatch's three gates on routes a player would take; detect getting stuck."
goal = """Test navigation on foot. walk_to and move go in a straight line, like a player holding forward: plan
routes around buildings, stalls and trees (look at the screenshot), for example out through the north, west
and east gates of the palisade and onto the slopes outside. Report places where the character gets stuck
although the way looks open, cannot pass where a player would expect to, or walks through something solid."""
class = "warrior"
setup = []
start = "mirewatch_square"
max_actions = 20

